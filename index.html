  <body class="bg-cream-100 text-plum-900 font-sans antialiased selection:bg-roseDust-200 selection:text-plum-950 overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script>
      // Service worker: Unregister on localhost for instant dev speed; enable in production
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister();
            }
          });
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').then((reg) => {
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('New version of Deeps Magical Journey ready. Updating...');
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  });
                }
              });
            }).catch(err => {
              console.log('SW registration note:', err.message);
            });
          });
        }
      }
    </script>
  </body>
